# WorldReasoner Configuration

# Database (SQLite)
database:
  db_path: worldreasoner.db  # Path to SQLite database file
  batch_size: 100             # Batch insert size for bulk operations
  timeout: 5.0                # Connection timeout in seconds

# Server Configuration
server:
  # Backend API server (FastAPI visualization backend)
  host: localhost
  port: 8018

  # MCP forecasting server (used by agents for forecasting)
  mcp_host: localhost
  mcp_port: 8110

  reload: true
  log_level: info

# LLM
llm:
  model: gemini/gemini-2.5-flash
  embedding_model: gemini/gemini-embedding-001
  max_completion_tokens: 2048
  temperature: 1.0
