[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldreasoner"
version = "0.1.0"
description = "LLM forecast benchmark system with temporal access control"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Yizhou Chi"}
]
keywords = ["llm", "forecasting", "benchmark", "mcp", "temporal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "litellm>=1.78.5",
    "pydantic",
    "pydantic-settings>=2.11.0",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "smolagents>=1.22.0",
]


[project.urls]
Homepage = "https://github.com/cyzus/worldreasoner"
Documentation = "https://github.com/cyzus/worldreasoner/docs"
Repository = "https://github.com/cyzus/worldreasoner"
Issues = "https://github.com/cyzus/worldreasoner/issues"

[project.scripts]
worldreasoner = "src.cli.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# Use copy mode instead of hardlinks (fixes Windows/cross-filesystem issues)
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.2.0",
]

