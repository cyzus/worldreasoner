# WorldReasoner Configuration

# Database
database:
  host: localhost
  port: 5432
  database: worldreasoner
  username: postgres
  password: ""  # Set via environment variable: WORLDREASONER__DATABASE__PASSWORD

# MCP Server
server:
  host: localhost
  port: 8000
  reload: true
  log_level: info

# Data directories
data_dir: ./data

# Embeddings (choose your provider)
# embeddings:
#   provider: openai  # openai | cohere | local
#   model: text-embedding-3-small
#   api_key: ""  # Set via environment variable

# Vector database (choose your provider)
# vector_db:
#   provider: pinecone  # pinecone | weaviate | qdrant
#   api_key: ""
#   environment: ""
#   index_name: worldreasoner

# LLM
llm:
  model: gemini/gemini-2.5-flash
  temperature: 1.0
