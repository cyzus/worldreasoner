[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "worldreasoner"
version = "0.1.0"
description = "LLM forecast benchmark system with temporal access control"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Yizhou Chi"}
]
keywords = ["llm", "forecasting", "benchmark", "mcp", "temporal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "litellm>=1.78.5",
    "loguru>=0.7.0",
    "pydantic",
    "pydantic-settings>=2.11.0",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "smolagents[toolkit,litellm,mcp]>=1.22.0",
    "crawl4ai>=0.4.0",
]


[project.urls]
Homepage = "https://github.com/cyzus/worldreasoner"
Documentation = "https://github.com/cyzus/worldreasoner/docs"
Repository = "https://github.com/cyzus/worldreasoner"
Issues = "https://github.com/cyzus/worldreasoner/issues"

[project.scripts]
worldreasoner = "src.cli.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
# Use copy mode instead of hardlinks (fixes Windows/cross-filesystem issues)
link-mode = "copy"

[dependency-groups]
dev = [
    "pytest-asyncio>=1.2.0",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow running (deselect with '-m \"not slow\"')",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

