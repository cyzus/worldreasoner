# Article Sources Configuration
# Defines RSS feeds and web sources for article collection

sources:
  # Technology RSS Feeds
  - name: "TechCrunch"
    url: "https://techcrunch.com/feed/"
    scraper_type: "rss"
    domain: "tech"
    rate_limit_per_second: 1.0
  
  - name: "Ars Technica"
    url: "https://feeds.arstechnica.com/arstechnica/index"
    scraper_type: "rss"
    domain: "tech"
    rate_limit_per_second: 1.0
  
  - name: "The Verge"
    url: "https://www.theverge.com/rss/index.xml"
    scraper_type: "rss"
    domain: "tech"
    rate_limit_per_second: 1.0

  # Finance RSS Feeds
  - name: "Seeking Alpha"
    url: "https://seekingalpha.com/feed"
    scraper_type: "rss"
    domain: "finance"
    rate_limit_per_second: 1.0


