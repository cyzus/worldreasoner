# Collection settings
collection:
  # Number of days to look back for articles
  days_back: 7
  
  # Maximum articles per source
  max_articles_per_source: 10
  
  # Domain filters (empty = all domains)
  domains: []
  
  # Rate limiting
  global_rate_limit_per_second: 2.0
  
  # Retry settings
  max_retries: 3
  retry_delay_seconds: 2
